#
# CI: 代码检查与修复
#
name: Check

run-name: Check ${{ github.ref_name }} branch by ${{ github.actor }}

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check with biome
        run: bun run biome ci
